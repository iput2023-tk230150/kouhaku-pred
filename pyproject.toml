version = "0.1.0"
description = "NHK紅白歌合戦 出演者予測システム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "pykakasi>=2.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "spotipy>=2.25.2",
    "python-dotenv>=1.2.1",
    "shap>=0.49.1",
    "matplotlib>=3.10.7",
    "lightgbm>=4.6.0",
    "dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]